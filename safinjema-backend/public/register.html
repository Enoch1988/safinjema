<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Register | SaFi Njema</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-box">
    <div class="auth-logo">
      <img src="image/Safi Njema logo No Background.png" alt="SaFi Njema">
      <h2>Create Account</h2>
      <p class="auth-sub">Join SaFi Njema for easy booking management</p>
    </div>
    <form id="regForm">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="rName" placeholder="Jane Smith" required autocomplete="name">
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="rEmail" placeholder="jane@example.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" id="rPhone" placeholder="+27 71 000 0000" autocomplete="tel">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="rPass" placeholder="Min 6 characters" required autocomplete="new-password">
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" id="rPass2" placeholder="Repeat password" required autocomplete="new-password">
      </div>

      <!-- Password strength -->
      <div style="margin-bottom:16px;">
        <div style="height:4px;background:#eee;border-radius:4px;overflow:hidden;">
          <div id="strengthBar" style="height:100%;width:0;transition:.3s;border-radius:4px;"></div>
        </div>
        <div id="strengthLabel" style="font-size:12px;color:#aaa;margin-top:4px;"></div>
      </div>

      <div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:16px;">
        <input type="checkbox" id="agreeTerms" style="margin-top:3px;accent-color:#2d9e60;" required>
        <label for="agreeTerms" style="font-size:13px;color:#666;cursor:pointer;">
          I agree to SaFi Njema's terms of service and privacy policy
        </label>
      </div>

      <button type="submit" class="form-submit" id="regBtn">
        <i class="fa fa-user-plus"></i> &nbsp;Create Account
      </button>
      <div class="alert" id="regMsg"></div>
    </form>
    <p class="auth-footer">
      Already have an account? <a href="login.html">Sign in</a>
    </p>
    <p class="auth-footer" style="margin-top:8px;">
      <a href="index.html" style="color:var(--muted,#888);">
        <i class="fa fa-arrow-left"></i> Back to Home
      </a>
    </p>
  </div>
</div>
<script src="Java.js"></script>
<script>
/* Redirect if already logged in */
if (Auth.isLoggedIn()) window.location.href = 'account.html';

/* Password strength meter */
document.getElementById('rPass').addEventListener('input', function() {
  const val   = this.value;
  const bar   = document.getElementById('strengthBar');
  const label = document.getElementById('strengthLabel');
  let s = 0;
  if (val.length >= 6)           s++;
  if (val.length >= 10)          s++;
  if (/[A-Z]/.test(val))         s++;
  if (/[0-9]/.test(val))         s++;
  if (/[^A-Za-z0-9]/.test(val))  s++;
  const colours = ['','#dc3545','#fd7e14','#ffc107','#2d9e60','#1a6b3c'];
  const labels  = ['','Weak','Fair','Good','Strong','Very Strong'];
  bar.style.width = `${(s/5)*100}%`;
  bar.style.background = colours[s] || '';
  label.textContent = val.length > 0 ? labels[s] : '';
  label.style.color = colours[s];
});

document.getElementById('regForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const btn     = document.getElementById('regBtn');
  const msg     = document.getElementById('regMsg');
  const name    = document.getElementById('rName').value.trim();
  const email   = document.getElementById('rEmail').value.trim();
  const phone   = document.getElementById('rPhone').value.trim();
  const pass    = document.getElementById('rPass').value;
  const pass2   = document.getElementById('rPass2').value;
  const agreed  = document.getElementById('agreeTerms').checked;

  if (!agreed) { msg.textContent = 'Please agree to the terms of service.'; msg.className = 'alert err'; return; }
  if (!name || !email || !pass || !pass2) { msg.textContent = 'Please fill in all required fields.'; msg.className = 'alert err'; return; }
  if (pass !== pass2) { msg.textContent = 'Passwords do not match.'; msg.className = 'alert err'; return; }
  if (pass.length < 6) { msg.textContent = 'Password must be at least 6 characters.'; msg.className = 'alert err'; return; }

  btn.disabled = true; btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Creating account…';

  const { ok, data } = await apiFetch('/auth/register', {
    method: 'POST',
    body: JSON.stringify({ name, email, phone, password: pass }),
  });

  btn.disabled = false; btn.innerHTML = '<i class="fa fa-user-plus"></i> &nbsp;Create Account';

  if (ok) {
    Auth.setToken(data.token);
    Auth.setUser(data.user);
    msg.textContent = '✓ Account created! Welcome to SaFi Njema 🌿'; msg.className = 'alert ok';
    showToast('Account created! Welcome 🌿', 'ok');
    setTimeout(() => window.location.href = 'account.html', 1400);
  } else {
    msg.textContent = data.message || 'Registration failed.'; msg.className = 'alert err';
  }
});
</script>
</body>
</html>

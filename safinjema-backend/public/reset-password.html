<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Reset Password | SaFi Njema</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-box">
    <div class="auth-logo">
      <img src="image/Safi Njema logo No Background.png" alt="SaFi Njema">
      <h2 id="authTitle">Reset Password</h2>
      <p class="auth-sub" id="authSub">Enter your new password below.</p>
    </div>

    <!-- Invalid token state -->
    <div id="invalidState" style="display:none;text-align:center;padding:20px 0;">
      <div style="font-size:48px;margin-bottom:12px;">⚠️</div>
      <p style="color:#dc3545;font-size:15px;margin-bottom:20px;">This reset link is invalid or has expired.</p>
      <a href="login.html" class="form-submit" style="display:block;text-decoration:none;text-align:center;">
        <i class="fa fa-arrow-left"></i> &nbsp;Back to Login
      </a>
      <p class="auth-footer" style="margin-top:16px;">
        Need a new link? <a href="forgot-password.html">Request one here</a>
      </p>
    </div>

    <!-- Reset form -->
    <form id="resetForm">
      <div class="form-group">
        <label>New Password</label>
        <div style="position:relative;">
          <input type="password" id="rNewPass" placeholder="Minimum 6 characters" required
                 style="padding-right:42px;">
          <button type="button" onclick="togglePass('rNewPass',this)"
                  style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#888;font-size:15px;">
            <i class="fa fa-eye"></i>
          </button>
        </div>
      </div>
      <div class="form-group">
        <label>Confirm New Password</label>
        <div style="position:relative;">
          <input type="password" id="rConfirmPass" placeholder="Repeat your new password" required
                 style="padding-right:42px;">
          <button type="button" onclick="togglePass('rConfirmPass',this)"
                  style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#888;font-size:15px;">
            <i class="fa fa-eye"></i>
          </button>
        </div>
      </div>

      <!-- Password strength indicator -->
      <div style="margin-bottom:16px;">
        <div style="height:4px;background:#eee;border-radius:4px;overflow:hidden;">
          <div id="strengthBar" style="height:100%;width:0;transition:.3s;border-radius:4px;"></div>
        </div>
        <div id="strengthLabel" style="font-size:12px;color:#aaa;margin-top:4px;"></div>
      </div>

      <button type="submit" class="form-submit" id="submitBtn">
        <i class="fa fa-lock"></i> &nbsp;Set New Password
      </button>
      <div class="alert" id="resetMsg"></div>
    </form>

    <!-- Success state (shown after reset) -->
    <div id="successState" style="display:none;text-align:center;padding:10px 0;">
      <div style="font-size:48px;margin-bottom:12px;">🎉</div>
      <h3 style="color:#1a6b3c;margin-bottom:8px;">Password Updated!</h3>
      <p style="font-size:14px;color:#666;margin-bottom:20px;">Your password has been changed successfully.</p>
      <a href="login.html" class="form-submit" style="display:block;text-decoration:none;text-align:center;">
        <i class="fa fa-sign-in-alt"></i> &nbsp;Sign In Now
      </a>
    </div>

    <p class="auth-footer" style="margin-top:16px;">
      <a href="index.html" style="color:var(--muted,#888);">
        <i class="fa fa-arrow-left"></i> Back to Home
      </a>
    </p>
  </div>
</div>

<script src="Java.js"></script>
<script>
/* ── Extract token from URL ── */
const urlParams = new URLSearchParams(window.location.search);
const token     = urlParams.get('token');

if (!token) {
  document.getElementById('resetForm').style.display    = 'none';
  document.getElementById('invalidState').style.display = 'block';
}

/* ── Password visibility toggle ── */
function togglePass(id, btn) {
  const input = document.getElementById(id);
  const isHidden = input.type === 'password';
  input.type = isHidden ? 'text' : 'password';
  btn.querySelector('i').className = isHidden ? 'fa fa-eye-slash' : 'fa fa-eye';
}

/* ── Password strength ── */
document.getElementById('rNewPass')?.addEventListener('input', function() {
  const val   = this.value;
  const bar   = document.getElementById('strengthBar');
  const label = document.getElementById('strengthLabel');
  let strength = 0;
  if (val.length >= 6)  strength++;
  if (val.length >= 10) strength++;
  if (/[A-Z]/.test(val)) strength++;
  if (/[0-9]/.test(val)) strength++;
  if (/[^A-Za-z0-9]/.test(val)) strength++;

  const colors = ['','#dc3545','#fd7e14','#ffc107','#2d9e60','#1a6b3c'];
  const labels = ['','Weak','Fair','Good','Strong','Very Strong'];
  bar.style.width      = `${(strength / 5) * 100}%`;
  bar.style.background = colors[strength] || '#eee';
  label.textContent    = val.length > 0 ? labels[strength] : '';
  label.style.color    = colors[strength] || '#aaa';
});

/* ── Form submit ── */
document.getElementById('resetForm')?.addEventListener('submit', async function(e) {
  e.preventDefault();
  const btn     = document.getElementById('submitBtn');
  const msg     = document.getElementById('resetMsg');
  const newPass = document.getElementById('rNewPass').value;
  const confirm = document.getElementById('rConfirmPass').value;

  if (newPass.length < 6) {
    msg.textContent = '⚠️ Password must be at least 6 characters.'; msg.className = 'alert err'; return;
  }
  if (newPass !== confirm) {
    msg.textContent = '⚠️ Passwords do not match.'; msg.className = 'alert err'; return;
  }

  btn.disabled = true; btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Updating…';

  const { ok, data } = await apiFetch('/auth/reset-password', {
    method: 'POST',
    body: JSON.stringify({ token, newPassword: newPass }),
  });

  if (ok) {
    document.getElementById('resetForm').style.display    = 'none';
    document.getElementById('successState').style.display = 'block';
  } else {
    btn.disabled = false; btn.innerHTML = '<i class="fa fa-lock"></i> &nbsp;Set New Password';
    if (data.message?.includes('Invalid') || data.message?.includes('expired')) {
      document.getElementById('resetForm').style.display    = 'none';
      document.getElementById('invalidState').style.display = 'block';
    } else {
      msg.textContent = `⚠️ ${data.message}`; msg.className = 'alert err';
    }
  }
});
</script>
</body>
</html>

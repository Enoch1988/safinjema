<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Login | SaFi Njema</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-box">
    <div class="auth-logo">
      <img src="image/Safi Njema logo No Background.png" alt="SaFi Njema">
      <h2>Welcome Back</h2>
      <p class="auth-sub">Sign in to manage your bookings</p>
    </div>
    <form id="loginForm">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="lEmail" placeholder="jane@example.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label>Password</label>
        <div style="position:relative;">
          <input type="password" id="lPass" placeholder="Your password" required autocomplete="current-password" style="padding-right:42px;">
          <button type="button" id="togglePassBtn"
                  style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#888;font-size:15px;"
                  onclick="togglePassVisibility()">
            <i class="fa fa-eye" id="eyeIcon"></i>
          </button>
        </div>
      </div>
      <button type="submit" class="form-submit" id="loginBtn">
        <i class="fa fa-sign-in-alt"></i> &nbsp;Sign In
      </button>
      <div class="alert" id="loginMsg"></div>
    </form>
    <p class="auth-footer">
      Forgot your password? <a href="forgot-password.html">Reset it here</a>
    </p>
    <p class="auth-footer">
      Don't have an account? <a href="register.html">Register here</a>
    </p>
    <p class="auth-footer" style="margin-top:16px;">
      <a href="index.html" style="color:var(--muted,#888);">
        <i class="fa fa-arrow-left"></i> Back to Home
      </a>
    </p>
  </div>
</div>
<script src="Java.js"></script>
<script>
/* Redirect if already logged in */
if (Auth.isLoggedIn()) {
  const redirect = new URLSearchParams(window.location.search).get('redirect') || 'account.html';
  window.location.href = redirect;
}

function togglePassVisibility() {
  const input = document.getElementById('lPass');
  const icon  = document.getElementById('eyeIcon');
  if (input.type === 'password') {
    input.type = 'text';
    icon.className = 'fa fa-eye-slash';
  } else {
    input.type = 'password';
    icon.className = 'fa fa-eye';
  }
}

document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const btn   = document.getElementById('loginBtn');
  const msg   = document.getElementById('loginMsg');
  const email = document.getElementById('lEmail').value.trim();
  const pass  = document.getElementById('lPass').value;

  if (!email || !pass) {
    msg.textContent = 'Please fill in all fields.'; msg.className = 'alert err'; return;
  }

  btn.disabled = true; btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Signing in…';

  const { ok, data } = await apiFetch('/auth/login', {
    method: 'POST',
    body: JSON.stringify({ email, password: pass }),
  });

  btn.disabled = false; btn.innerHTML = '<i class="fa fa-sign-in-alt"></i> &nbsp;Sign In';

  if (ok) {
    Auth.setToken(data.token);
    Auth.setUser(data.user);
    msg.textContent = '✓ Signed in successfully!'; msg.className = 'alert ok';
    showToast(`Welcome back, ${data.user.name.split(' ')[0]}! 👋`, 'ok');
    const redirect = new URLSearchParams(window.location.search).get('redirect');
    setTimeout(() => {
      window.location.href = redirect || (data.user.role === 'admin' ? 'admin.html' : 'account.html');
    }, 900);
  } else {
    msg.textContent = data.message || 'Login failed. Please try again.'; msg.className = 'alert err';
    document.getElementById('lPass').value = '';
  }
});
</script>
</body>
</html>

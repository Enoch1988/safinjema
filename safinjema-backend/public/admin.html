<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Dashboard | SaFi Njema</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
<style>
  :root { --sidebar-w: 240px; }
  body { background: #f4f6f4; }
  .admin-layout { display:flex; min-height:100vh; }

  /* Sidebar */
  .sidebar {
    width: var(--sidebar-w); background: linear-gradient(180deg,#1a6b3c,#13512e);
    color:#fff; position:fixed; top:0; left:0; height:100vh; overflow-y:auto;
    z-index:100; display:flex; flex-direction:column;
  }
  .sidebar-logo { padding:28px 24px 20px; border-bottom:1px solid rgba(255,255,255,.1); }
  .sidebar-logo img { height:38px; }
  .sidebar-logo p { font-size:11px; color:rgba(255,255,255,.6); margin:4px 0 0; }
  .sidebar nav { flex:1; padding:16px 0; }
  .nav-item { display:flex; align-items:center; gap:12px; padding:12px 24px; cursor:pointer;
    font-size:14px; font-weight:500; color:rgba(255,255,255,.75); transition:.2s;
    border-left:3px solid transparent; text-decoration:none; }
  .nav-item:hover, .nav-item.active { background:rgba(255,255,255,.1); color:#fff; border-left-color:#fff; }
  .nav-item i { width:18px; text-align:center; }
  .sidebar-footer { padding:20px 24px; border-top:1px solid rgba(255,255,255,.1); font-size:12px; color:rgba(255,255,255,.5); }

  /* Main */
  .admin-main { margin-left:var(--sidebar-w); flex:1; display:flex; flex-direction:column; }
  .admin-topbar { background:#fff; padding:16px 28px; display:flex; align-items:center;
    justify-content:space-between; border-bottom:1px solid #e5e5e5; position:sticky; top:0; z-index:50; }
  .admin-topbar h1 { font-family:var(--fd,'serif'); font-size:1.3rem; color:#1a1a1a; }
  .admin-content { padding:28px; flex:1; }

  /* Stat cards */
  .stat-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:20px; margin-bottom:28px; }
  .stat-card { background:#fff; border-radius:14px; padding:22px 24px; display:flex; align-items:center;
    gap:16px; box-shadow:0 2px 10px rgba(0,0,0,.05); border:1px solid #eee; }
  .stat-icon { width:52px; height:52px; border-radius:12px; display:flex; align-items:center;
    justify-content:center; font-size:22px; flex-shrink:0; }
  .stat-card strong { font-size:28px; font-weight:700; color:#1a1a1a; display:block; }
  .stat-card span { font-size:13px; color:#888; }

  /* Tables */
  .panel { background:#fff; border-radius:14px; padding:24px; box-shadow:0 2px 10px rgba(0,0,0,.05); border:1px solid #eee; margin-bottom:24px; }
  .panel-hd { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:12px; }
  .panel-hd h2 { font-size:16px; font-weight:700; color:#1a1a1a; }
  table { width:100%; border-collapse:collapse; }
  th { font-size:12px; font-weight:600; color:#666; text-transform:uppercase; letter-spacing:.5px;
    padding:10px 14px; background:#f8f9f8; border-bottom:2px solid #eee; text-align:left; }
  td { padding:12px 14px; font-size:14px; border-bottom:1px solid #f0f0f0; }
  tr:last-child td { border-bottom:none; }
  tr:hover td { background:#fafcfa; }

  /* Status badges */
  .badge { display:inline-block; padding:3px 12px; border-radius:50px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; }
  .badge-pending    { background:#fff3cd; color:#856404; }
  .badge-confirmed  { background:#d1e7dd; color:#0f5132; }
  .badge-in_progress{ background:#cff4fc; color:#055160; }
  .badge-completed  { background:#d1e7dd; color:#0f5132; }
  .badge-cancelled  { background:#f8d7da; color:#842029; }
  .badge-unread     { background:#cff4fc; color:#055160; }
  .badge-read       { background:#e2e3e5; color:#41464b; }
  .badge-replied    { background:#d1e7dd; color:#0f5132; }

  /* Action buttons */
  .btn-sm { padding:5px 12px; border-radius:6px; font-size:12px; font-weight:600;
    border:none; cursor:pointer; transition:.2s; }
  .btn-sm-green  { background:#d1e7dd; color:#0f5132; }
  .btn-sm-green:hover { background:#b4d9c5; }
  .btn-sm-red    { background:#f8d7da; color:#842029; }
  .btn-sm-red:hover { background:#f0b8be; }
  .btn-sm-blue   { background:#cff4fc; color:#055160; }
  .btn-sm-blue:hover { background:#b0ecf9; }
  .btn-sm-orange { background:#fff3cd; color:#856404; }

  /* Filters */
  .filter-row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .filter-row input, .filter-row select {
    padding:7px 12px; border:1px solid #ddd; border-radius:8px; font-size:13px;
    font-family:inherit; outline:none; transition:.2s;
  }
  .filter-row input:focus, .filter-row select:focus { border-color:#2d9e60; }

  /* Tabs */
  .tabs { display:flex; gap:4px; border-bottom:2px solid #eee; margin-bottom:24px; }
  .tab { padding:10px 20px; border:none; background:none; cursor:pointer; font-size:14px;
    font-weight:500; color:#888; border-bottom:2px solid transparent; margin-bottom:-2px; transition:.2s; }
  .tab.active { color:#2d9e60; border-bottom-color:#2d9e60; }

  /* Modal */
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:1000; align-items:center; justify-content:center; }
  .modal-overlay.open { display:flex; }
  .modal { background:#fff; border-radius:16px; padding:28px; max-width:520px; width:90%; max-height:85vh; overflow-y:auto; }
  .modal h3 { font-family:var(--fd,'serif'); font-size:1.2rem; margin-bottom:20px; }
  .modal .form-group { margin-bottom:16px; }
  .modal label { font-size:13px; font-weight:600; color:#555; display:block; margin-bottom:6px; }
  .modal input, .modal select, .modal textarea {
    width:100%; padding:9px 12px; border:1px solid #ddd; border-radius:8px;
    font-family:inherit; font-size:14px; outline:none; box-sizing:border-box;
  }
  .modal input:focus, .modal select:focus { border-color:#2d9e60; }
  .modal-footer { display:flex; gap:10px; justify-content:flex-end; margin-top:20px; }

  /* Loading */
  .loading { text-align:center; padding:40px; color:#888; font-size:14px; }
  .empty   { text-align:center; padding:40px; color:#aaa; }

  @media(max-width:900px){
    .sidebar { transform:translateX(-100%); transition:.3s; }
    .sidebar.open { transform:translateX(0); }
    .admin-main { margin-left:0; }
    .stat-grid { grid-template-columns:1fr 1fr; }
  }
</style>
</head>
<body>
<div class="admin-layout">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <img src="image/Safi Njema logo No Background.png" alt="SaFi Njema">
      <p>Admin Dashboard</p>
    </div>
    <nav>
      <a class="nav-item active" data-tab="dashboard" onclick="switchTab('dashboard')"><i class="fa fa-tachometer-alt"></i> Dashboard</a>
      <a class="nav-item" data-tab="bookings"  onclick="switchTab('bookings')"><i class="fa fa-calendar-check"></i> Bookings</a>
      <a class="nav-item" data-tab="messages"  onclick="switchTab('messages')"><i class="fa fa-envelope"></i> Messages</a>
      <a class="nav-item" data-tab="customers" onclick="switchTab('customers')"><i class="fa fa-users"></i> Customers</a>
      <a class="nav-item" data-tab="audit"     onclick="switchTab('audit')"><i class="fa fa-history"></i> Audit Log</a>
      <hr style="border-color:rgba(255,255,255,.1);margin:8px 16px;">
      <a class="nav-item" href="index.html"><i class="fa fa-home"></i> View Website</a>
      <a class="nav-item" href="#" onclick="adminLogout()"><i class="fa fa-sign-out-alt"></i> Logout</a>
    </nav>
    <div class="sidebar-footer">SaFi Njema © 2026<br>Eco-Friendly Solutions 🌿</div>
  </aside>

  <!-- MAIN -->
  <main class="admin-main">
    <div class="admin-topbar">
      <h1 id="pageTitle">Dashboard</h1>
      <div style="display:flex;align-items:center;gap:16px;">
        <span id="adminName" style="font-size:14px;color:#555;"></span>
        <a href="Book.html" class="btn-sm btn-sm-green" style="text-decoration:none;padding:8px 16px;"><i class="fa fa-plus"></i> New Booking</a>
      </div>
    </div>

    <div class="admin-content">

      <!-- ── DASHBOARD TAB ── -->
      <div id="tab-dashboard">
        <div class="stat-grid" id="statsGrid">
          <div class="loading"><i class="fa fa-spinner fa-spin"></i> Loading stats…</div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;" id="dashPanels">
          <div class="panel">
            <div class="panel-hd"><h2>Recent Bookings</h2></div>
            <div id="recentBookings"><div class="loading"><i class="fa fa-spinner fa-spin"></i></div></div>
          </div>
          <div class="panel">
            <div class="panel-hd"><h2>Upcoming (Next 7 Days)</h2></div>
            <div id="upcomingBookings"><div class="loading"><i class="fa fa-spinner fa-spin"></i></div></div>
          </div>
        </div>
      </div>

      <!-- ── BOOKINGS TAB ── -->
      <div id="tab-bookings" style="display:none;">
        <div class="panel">
          <div class="panel-hd">
            <h2>All Bookings</h2>
            <div class="filter-row">
              <input id="bSearch" placeholder="Search name/email/ref…" oninput="debounce(loadBookings,500)()">
              <select id="bStatusFilter" onchange="loadBookings()">
                <option value="">All Statuses</option>
                <option value="pending">Pending</option>
                <option value="confirmed">Confirmed</option>
                <option value="in_progress">In Progress</option>
                <option value="completed">Completed</option>
                <option value="cancelled">Cancelled</option>
              </select>
              <input type="date" id="bDateFilter" onchange="loadBookings()">
              <button class="btn-sm btn-sm-blue" onclick="loadBookings()"><i class="fa fa-sync"></i></button>
            </div>
          </div>
          <div id="bookingsTable"><div class="loading"><i class="fa fa-spinner fa-spin"></i></div></div>
          <div id="bookingsPagination" style="padding:16px 0;text-align:center;"></div>
        </div>
      </div>

      <!-- ── MESSAGES TAB ── -->
      <div id="tab-messages" style="display:none;">
        <div class="panel">
          <div class="panel-hd">
            <h2>Contact Messages</h2>
            <select id="msgStatusFilter" onchange="loadMessages()">
              <option value="">All Messages</option>
              <option value="unread">Unread</option>
              <option value="read">Read</option>
              <option value="replied">Replied</option>
            </select>
          </div>
          <div id="messagesTable"><div class="loading"><i class="fa fa-spinner fa-spin"></i></div></div>
        </div>
      </div>

      <!-- ── CUSTOMERS TAB ── -->
      <div id="tab-customers" style="display:none;">
        <div class="panel">
          <div class="panel-hd">
            <h2>Customers</h2>
            <input id="userSearch" placeholder="Search name/email…" oninput="debounce(loadUsers,500)()">
          </div>
          <div id="usersTable"><div class="loading"><i class="fa fa-spinner fa-spin"></i></div></div>
        </div>
      </div>

      <!-- ── AUDIT TAB ── -->
      <div id="tab-audit" style="display:none;">
        <div class="panel">
          <div class="panel-hd"><h2>Audit Log</h2><button class="btn-sm btn-sm-blue" onclick="loadAudit()"><i class="fa fa-sync"></i></button></div>
          <div id="auditTable"><div class="loading"><i class="fa fa-spinner fa-spin"></i></div></div>
        </div>
      </div>

    </div><!-- /admin-content -->
  </main>
</div>

<!-- BOOKING EDIT MODAL -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h3>Update Booking</h3>
    <div id="editModalContent"></div>
    <div class="modal-footer">
      <button class="btn-sm btn-sm-red" onclick="document.getElementById('editModal').classList.remove('open')">Cancel</button>
      <button class="btn-sm btn-sm-green" onclick="submitBookingEdit()">Save Changes</button>
    </div>
  </div>
</div>

<script src="Java.js"></script>
<script>
/* ══════════════
   AUTH GUARD
   ══════════════ */
(function() {
  if (!Auth.isLoggedIn() || !Auth.isAdmin()) {
    alert('Admin access required. Please log in.');
    window.location.href = 'login.html';
  }
  const user = Auth.getUser();
  document.getElementById('adminName').textContent = `👤 ${user?.name || 'Admin'}`;
})();

function adminLogout() {
  Auth.clear();
  window.location.href = 'login.html';
}

/* ══════════════
   TAB SYSTEM
   ══════════════ */
const tabs = ['dashboard','bookings','messages','customers','audit'];
const titles = { dashboard:'Dashboard', bookings:'Bookings', messages:'Messages', customers:'Customers', audit:'Audit Log' };
const loaders = { bookings:loadBookings, messages:loadMessages, customers:loadUsers, audit:loadAudit };

function switchTab(name) {
  tabs.forEach(t => {
    document.getElementById(`tab-${t}`).style.display = t === name ? 'block' : 'none';
    document.querySelector(`[data-tab="${t}"]`).classList.toggle('active', t === name);
  });
  document.getElementById('pageTitle').textContent = titles[name];
  if (loaders[name]) loaders[name]();
}

/* Debounce helper */
const _debounceTimers = {};
function debounce(fn, ms) {
  return (...args) => {
    clearTimeout(_debounceTimers[fn]);
    _debounceTimers[fn] = setTimeout(() => fn(...args), ms);
  };
}

/* ══════════════
   DASHBOARD
   ══════════════ */
async function loadDashboard() {
  const { ok, data } = await apiFetch('/admin/dashboard');
  if (!ok) { document.getElementById('statsGrid').innerHTML = `<p style="color:red">${data.message}</p>`; return; }

  const s = data.stats;
  const cards = [
    { icon:'📅', bg:'#d1e7dd', label:'Total Bookings', value: s.bookings.total },
    { icon:'⏳', bg:'#fff3cd', label:'Pending',         value: s.bookings.pending },
    { icon:'✅', bg:'#d1e7dd', label:'Confirmed',        value: s.bookings.confirmed },
    { icon:'🏆', bg:'#cff4fc', label:'Completed',        value: s.bookings.completed },
    { icon:'👤', bg:'#e2d9f3', label:'Customers',        value: s.customers },
    { icon:'📩', bg:'#f8d7da', label:'Unread Messages',  value: s.messages.unread },
    { icon:'💰', bg:'#d1e7dd', label:'Revenue (ZAR)',     value: `R ${Number(s.revenue).toFixed(2)}` },
  ];
  document.getElementById('statsGrid').innerHTML = cards.map(c => `
    <div class="stat-card">
      <div class="stat-icon" style="background:${c.bg}">${c.icon}</div>
      <div><strong>${c.value}</strong><span>${c.label}</span></div>
    </div>`).join('');

  // Recent bookings table
  document.getElementById('recentBookings').innerHTML = data.recentBookings.length
    ? `<table><thead><tr><th>Ref</th><th>Name</th><th>Service</th><th>Date</th><th>Status</th></tr></thead><tbody>
        ${data.recentBookings.map(b => `<tr>
          <td style="font-size:12px;color:#888;">${b.booking_ref}</td>
          <td>${b.name}</td><td style="font-size:13px;">${b.service}</td>
          <td style="font-size:13px;">${b.date}</td>
          <td><span class="badge badge-${b.status}">${b.status}</span></td>
        </tr>`).join('')}
      </tbody></table>` : '<div class="empty">No bookings yet.</div>';

  document.getElementById('upcomingBookings').innerHTML = data.upcomingBookings.length
    ? data.upcomingBookings.map(b => `
      <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f0f0f0;font-size:14px;">
        <div>
          <strong>${b.name}</strong>
          <div style="font-size:12px;color:#888;">${b.service}</div>
        </div>
        <div style="text-align:right;">
          <div>${b.date} ${b.time}</div>
          <span class="badge badge-${b.status}">${b.status}</span>
        </div>
      </div>`).join('') : '<div class="empty">No upcoming bookings.</div>';
}

/* ══════════════
   BOOKINGS
   ══════════════ */
let currentBookingPage = 1;

async function loadBookings(page = 1) {
  currentBookingPage = page;
  const search  = document.getElementById('bSearch')?.value || '';
  const status  = document.getElementById('bStatusFilter')?.value || '';
  const date    = document.getElementById('bDateFilter')?.value || '';
  const params  = new URLSearchParams({ page, limit:15, ...(search&&{search}), ...(status&&{status}), ...(date&&{date}) });

  document.getElementById('bookingsTable').innerHTML = '<div class="loading"><i class="fa fa-spinner fa-spin"></i></div>';
  const { ok, data } = await apiFetch(`/admin/bookings?${params}`);
  if (!ok) { document.getElementById('bookingsTable').innerHTML = `<p style="color:red">${data.message}</p>`; return; }

  if (!data.bookings.length) { document.getElementById('bookingsTable').innerHTML = '<div class="empty">No bookings found.</div>'; return; }

  document.getElementById('bookingsTable').innerHTML = `
    <table>
      <thead><tr><th>Ref</th><th>Name</th><th>Phone</th><th>Service</th><th>Date</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody>
        ${data.bookings.map(b => `<tr>
          <td style="font-size:12px;color:#888;">${b.booking_ref}</td>
          <td><strong>${b.name}</strong><div style="font-size:12px;color:#888;">${b.email}</div></td>
          <td style="font-size:13px;">${b.phone}</td>
          <td style="font-size:13px;">${b.service}</td>
          <td style="font-size:13px;">${b.date} <span style="color:#888;">${b.time}</span></td>
          <td><span class="badge badge-${b.status}">${b.status}</span></td>
          <td>
            <button class="btn-sm btn-sm-blue" onclick="openEditModal(${b.id})"><i class="fa fa-edit"></i></button>
            <a href="https://wa.me/${b.phone.replace(/\D/g,'')}?text=Hi%20${encodeURIComponent(b.name)}" target="_blank" class="btn-sm btn-sm-green" style="text-decoration:none;margin-left:4px;"><i class="fab fa-whatsapp"></i></a>
            <button class="btn-sm btn-sm-red" onclick="deleteBooking(${b.id})" style="margin-left:4px;"><i class="fa fa-trash"></i></button>
          </td>
        </tr>`).join('')}
      </tbody>
    </table>`;

  // Pagination
  const totalPages = data.totalPages;
  let paginationHtml = '';
  for (let i = 1; i <= totalPages; i++) {
    paginationHtml += `<button onclick="loadBookings(${i})" class="btn-sm ${i===page?'btn-sm-green':'btn-sm-blue'}" style="margin:0 3px;">${i}</button>`;
  }
  document.getElementById('bookingsPagination').innerHTML = paginationHtml;
}

let editingBookingId = null;
async function openEditModal(id) {
  editingBookingId = id;
  const { ok, data } = await apiFetch(`/admin/bookings/${id}`);
  if (!ok) { showToast(data.message, 'err'); return; }
  const b = data.booking;
  document.getElementById('editModalContent').innerHTML = `
    <div class="form-group"><label>Status</label>
      <select id="editStatus">
        ${['pending','confirmed','in_progress','completed','cancelled'].map(s => `<option value="${s}" ${b.status===s?'selected':''}>${s}</option>`).join('')}
      </select>
    </div>
    <div class="form-group"><label>Assigned To</label><input id="editAssigned" value="${b.assigned_to||''}" placeholder="Cleaner name"></div>
    <div class="form-group"><label>Price (ZAR)</label><input type="number" id="editPrice" value="${b.price||''}" placeholder="0.00" step="0.01"></div>
    <div class="form-group"><label>Notes (admin)</label><textarea id="editNotes" style="height:80px;">${b.notes||''}</textarea></div>
  `;
  document.getElementById('editModal').classList.add('open');
}

async function submitBookingEdit() {
  const payload = {
    status:      document.getElementById('editStatus').value,
    assigned_to: document.getElementById('editAssigned').value,
    price:       document.getElementById('editPrice').value || null,
    notes:       document.getElementById('editNotes').value,
  };
  const { ok, data } = await apiFetch(`/admin/bookings/${editingBookingId}`, { method:'PUT', body:JSON.stringify(payload) });
  showToast(data.message, ok?'ok':'err');
  if (ok) { document.getElementById('editModal').classList.remove('open'); loadBookings(currentBookingPage); }
}

async function deleteBooking(id) {
  if (!confirm('Delete this booking permanently?')) return;
  const { ok, data } = await apiFetch(`/admin/bookings/${id}`, { method:'DELETE' });
  showToast(data.message, ok?'ok':'err');
  if (ok) loadBookings(currentBookingPage);
}

/* ══════════════
   MESSAGES
   ══════════════ */
async function loadMessages() {
  const status = document.getElementById('msgStatusFilter')?.value || '';
  const params = new URLSearchParams({ limit:50, ...(status&&{status}) });
  document.getElementById('messagesTable').innerHTML = '<div class="loading"><i class="fa fa-spinner fa-spin"></i></div>';
  const { ok, data } = await apiFetch(`/admin/messages?${params}`);
  if (!ok || !data.messages.length) { document.getElementById('messagesTable').innerHTML = '<div class="empty">No messages.</div>'; return; }
  document.getElementById('messagesTable').innerHTML = `
    <table>
      <thead><tr><th>Date</th><th>Name</th><th>Email</th><th>Service</th><th>Message</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody>
        ${data.messages.map(m => `<tr>
          <td style="font-size:12px;color:#888;white-space:nowrap;">${m.created_at.slice(0,16)}</td>
          <td><strong>${m.name}</strong></td>
          <td style="font-size:13px;"><a href="mailto:${m.email}">${m.email}</a></td>
          <td style="font-size:13px;">${m.service||'—'}</td>
          <td style="font-size:13px;max-width:280px;word-break:break-word;">${m.message}</td>
          <td><span class="badge badge-${m.status}">${m.status}</span></td>
          <td style="white-space:nowrap;">
            <a href="mailto:${m.email}?subject=Re: SaFi Njema Enquiry" class="btn-sm btn-sm-green" style="text-decoration:none;" onclick="markMessage(${m.id},'replied')"><i class="fa fa-reply"></i></a>
            <button class="btn-sm btn-sm-blue"  onclick="markMessage(${m.id},'read')"    style="margin-left:4px;"><i class="fa fa-eye"></i></button>
            <button class="btn-sm btn-sm-red"   onclick="deleteMessage(${m.id})"         style="margin-left:4px;"><i class="fa fa-trash"></i></button>
          </td>
        </tr>`).join('')}
      </tbody>
    </table>`;
}

async function markMessage(id, status) {
  const { ok, data } = await apiFetch(`/admin/messages/${id}`, { method:'PUT', body:JSON.stringify({status}) });
  showToast(data.message, ok?'ok':'err');
  if (ok) loadMessages();
}
async function deleteMessage(id) {
  if (!confirm('Delete this message?')) return;
  const { ok, data } = await apiFetch(`/admin/messages/${id}`, { method:'DELETE' });
  showToast(data.message, ok?'ok':'err');
  if (ok) loadMessages();
}

/* ══════════════
   USERS
   ══════════════ */
async function loadUsers() {
  const search = document.getElementById('userSearch')?.value || '';
  const params = new URLSearchParams({ limit:50, ...(search&&{search}) });
  document.getElementById('usersTable').innerHTML = '<div class="loading"><i class="fa fa-spinner fa-spin"></i></div>';
  const { ok, data } = await apiFetch(`/admin/users?${params}`);
  if (!ok || !data.users.length) { document.getElementById('usersTable').innerHTML = '<div class="empty">No users found.</div>'; return; }
  document.getElementById('usersTable').innerHTML = `
    <table>
      <thead><tr><th>Joined</th><th>Name</th><th>Email</th><th>Phone</th><th>Role</th><th>Bookings</th><th>Actions</th></tr></thead>
      <tbody>
        ${data.users.map(u => `<tr>
          <td style="font-size:12px;color:#888;">${u.created_at.slice(0,10)}</td>
          <td><strong>${u.name}</strong></td>
          <td style="font-size:13px;">${u.email}</td>
          <td style="font-size:13px;">${u.phone||'—'}</td>
          <td><span class="badge ${u.role==='admin'?'badge-confirmed':'badge-pending'}">${u.role}</span></td>
          <td style="text-align:center;">${u.booking_count}</td>
          <td>
            <button class="btn-sm btn-sm-red" onclick="deleteUser(${u.id})" ${u.id===Auth.getUser()?.id?'disabled':''}>
              <i class="fa fa-trash"></i>
            </button>
          </td>
        </tr>`).join('')}
      </tbody>
    </table>`;
}

async function deleteUser(id) {
  if (!confirm('Delete this user? Their bookings will be kept.')) return;
  const { ok, data } = await apiFetch(`/admin/users/${id}`, { method:'DELETE' });
  showToast(data.message, ok?'ok':'err');
  if (ok) loadUsers();
}

/* ══════════════
   AUDIT
   ══════════════ */
async function loadAudit() {
  document.getElementById('auditTable').innerHTML = '<div class="loading"><i class="fa fa-spinner fa-spin"></i></div>';
  const { ok, data } = await apiFetch('/admin/audit?limit=100');
  if (!ok) { document.getElementById('auditTable').innerHTML = `<p style="color:red">${data.message}</p>`; return; }
  document.getElementById('auditTable').innerHTML = `
    <table>
      <thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Entity</th><th>Detail</th><th>IP</th></tr></thead>
      <tbody>
        ${data.logs.map(l => `<tr>
          <td style="font-size:12px;color:#888;white-space:nowrap;">${l.created_at.slice(0,16)}</td>
          <td style="font-size:13px;">${l.actor||'—'}</td>
          <td><span class="badge badge-confirmed" style="background:#e2e3e5;color:#41464b;">${l.action}</span></td>
          <td style="font-size:13px;">${l.entity||'—'} ${l.entity_id?`#${l.entity_id}`:''}</td>
          <td style="font-size:13px;">${l.detail||'—'}</td>
          <td style="font-size:12px;color:#aaa;">${l.ip||'—'}</td>
        </tr>`).join('')}
      </tbody>
    </table>`;
}

/* Load initial dashboard */
loadDashboard();
</script>

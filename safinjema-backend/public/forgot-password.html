<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Forgot Password | SaFi Njema</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-box">
    <div class="auth-logo">
      <img src="image/Safi Njema logo No Background.png" alt="SaFi Njema">
      <h2>Forgot Password?</h2>
      <p class="auth-sub">Enter your email and we'll send a reset link.</p>
    </div>

    <form id="forgotForm">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="fEmail" placeholder="your@email.com" required>
      </div>
      <button type="submit" class="form-submit" id="forgotBtn">
        <i class="fa fa-paper-plane"></i> &nbsp;Send Reset Link
      </button>
      <div class="alert" id="forgotMsg"></div>
    </form>

    <div id="sentState" style="display:none;text-align:center;padding:10px 0;">
      <div style="font-size:48px;margin-bottom:12px;">📧</div>
      <h3 style="color:#1a6b3c;margin-bottom:8px;">Check Your Email</h3>
      <p style="font-size:14px;color:#666;margin-bottom:4px;">
        If an account exists for <strong id="sentEmail"></strong>,<br>
        a password reset link has been sent.
      </p>
      <p style="font-size:12px;color:#aaa;">The link expires in 1 hour.</p>
    </div>

    <p class="auth-footer" style="margin-top:20px;">
      Remembered it? <a href="login.html">Sign in</a>
    </p>
    <p class="auth-footer">
      <a href="index.html" style="color:var(--muted,#888);">
        <i class="fa fa-arrow-left"></i> Back to Home
      </a>
    </p>
  </div>
</div>

<script src="Java.js"></script>
<script>
document.getElementById('forgotForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const btn   = document.getElementById('forgotBtn');
  const msg   = document.getElementById('forgotMsg');
  const email = document.getElementById('fEmail').value.trim();

  btn.disabled = true; btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Sending…';

  const { ok, data } = await apiFetch('/auth/forgot-password', {
    method: 'POST',
    body: JSON.stringify({ email }),
  });

  if (ok) {
    document.getElementById('forgotForm').style.display = 'none';
    document.getElementById('sentEmail').textContent    = email;
    document.getElementById('sentState').style.display = 'block';
  } else {
    btn.disabled = false; btn.innerHTML = '<i class="fa fa-paper-plane"></i> &nbsp;Send Reset Link';
    msg.textContent = `⚠️ ${data.message}`; msg.className = 'alert err';
  }
});
</script>
</body>
</html>

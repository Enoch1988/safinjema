version: "3.9"

services:
  api:
    build: .
    container_name: safinjema-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data          # Persist SQLite database
      - ./public:/app/public      # Serve frontend files
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Optional: Nginx reverse proxy + SSL termination
  nginx:
    image: nginx:alpine
    container_name: safinjema-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/usr/share/nginx/html:ro
      - ./ssl:/etc/nginx/ssl:ro        # Mount your SSL certs here
    depends_on:
      - api
    profiles:
      - production                     # Only starts with: docker compose --profile production up
